[package]
name = "skope-wasm"
version = "0.5.0"
edition = "2024"
description = "WebAssembly bindings for skope query"
repository = "https://github.com/bede/skope"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
skope = { path = "..", default-features = false, features = ["gz"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
